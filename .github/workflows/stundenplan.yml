# Holt alle 6 Stunden den Stundenplan aus OpenOLAT (data/stundenplan.json)
# und die Ersatzkopie des Prüfungskalenders (data/pruefungen.ics).
# Der iCal-Link ist geheim und liegt als Repository-Secret OLAT_ICS_URL bei GitHub.
name: Stundenplan aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stundenplan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stundenplan umwandeln
        env:
          OLAT_ICS_URL: ${{ secrets.OLAT_ICS_URL }}
        run: python3 tools/stundenplan.py data/stundenplan.json

      # Ersatzkopie der Prüfungen (wird gezeigt, wenn der Live-Abruf bei Google fehlschlägt).
      # Google liefert die Einträge in zufälliger Reihenfolge und setzt DTSTAMP bei jedem Abruf neu.
      # Darum Einträge sortiert und ohne DTSTAMP vergleichen, damit nur echte Änderungen gespeichert werden.
      - name: Ersatzkopie der Prüfungen aktualisieren
        run: |
          url="https://calendar.google.com/calendar/ical/86f3a3eb765f4c49fc250489d0a1c9230bdb67dfe31d7a3ce306e5fa1a8b4028%40group.calendar.google.com/public/basic.ics"
          curl -fsS --max-time 60 "$url" -o /tmp/pruefungen.ics
          grep -q "BEGIN:VEVENT" /tmp/pruefungen.ics || { echo "Download leer, Ersatzkopie bleibt."; exit 0; }
          if python3 - /tmp/pruefungen.ics data/pruefungen.ics <<'PY'
          import re, sys
          def events(path):
              text = re.sub(r"\r?\n[ \t]", "", open(path, encoding="utf-8").read())
              blocks = re.findall(r"BEGIN:VEVENT.*?END:VEVENT", text, re.S)
              return sorted("\n".join(l for l in b.splitlines() if not l.startswith("DTSTAMP")) for b in blocks)
          sys.exit(0 if events(sys.argv[1]) == events(sys.argv[2]) else 1)
          PY
          then
            echo "Prüfungen unverändert."
          else
            cp /tmp/pruefungen.ics data/pruefungen.ics
            echo "Ersatzkopie aktualisiert: $(grep -c BEGIN:VEVENT data/pruefungen.ics) Einträge."
          fi

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- data/; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stundenplan.json data/pruefungen.ics
          git commit -m "Daten aktualisiert (Stundenplan / Prüfungen)"
          git push
